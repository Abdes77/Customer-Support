name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same local connection strings as .env.example and scripts/dev-services.sh.
      DATABASE_URL: postgresql://hsrb:hsrb@127.0.0.1:5432/hsrb_dev
      DATABASE_URL_DIRECT: postgresql://hsrb:hsrb@127.0.0.1:5432/hsrb_dev
      TEST_DATABASE_URL: postgresql://hsrb:hsrb@127.0.0.1:5432/hsrb_test
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the database role and databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE hsrb LOGIN PASSWORD 'hsrb' CREATEDB CREATEROLE BYPASSRLS;
          CREATE DATABASE hsrb_dev OWNER hsrb;
          CREATE DATABASE hsrb_test OWNER hsrb;
          SQL

      - name: Verify (typecheck, lint, tests)
        run: pnpm verify
